# Serp4J CI (implementation-plan.md Paket A, WP4 §6.2, ADR-002, ADR-015).
#
# Kompiliert mit JDK 21 (Java-8-Module mit --release 8), testet auf JDK 21 und JDK 8, prüft Javadoc und
# ArchUnit-Regeln und baut das Central-Portal-Bündel ohne Upload. Bei einem Push auf main werden zusätzlich
# Snapshots publiziert, sobald die Secrets eingerichtet sind (siehe PUBLISHING.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build und Tests (JDK 21 + JDK 8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 8 zuerst, JDK 21 zuletzt: JAVA_HOME zeigt danach auf 21. Beide JDKs findet Gradle über
      # JAVA_HOME_8_X64 / JAVA_HOME_21_X64 (gradle.properties: org.gradle.java.installations.fromEnv).
      - name: JDK 8 (Test-Laufzeit)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: JDK 21 (Build-Toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build, Tests (JDK 21 und JDK 8), Javadoc, ArchUnit
        run: ./gradlew build --stacktrace

      - name: Central-Portal-Bündel erzeugen (kein Upload)
        run: ./gradlew zipAggregation --stacktrace

      - name: Testberichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  snapshot:
    name: Snapshots nach Maven Central (nur main)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
    steps:
      - name: Secrets prüfen
        id: secrets
        run: |
          if [ -n "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] && [ -n "$ORG_GRADLE_PROJECT_mavenCentralPassword" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Maven-Central-Secrets fehlen, Snapshot-Veröffentlichung übersprungen (siehe PUBLISHING.md)."
          fi

      - name: Checkout
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: JDK 8 (Test-Laufzeit)
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: JDK 21 (Build-Toolchain)
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        if: steps.secrets.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Snapshots publizieren
        if: steps.secrets.outputs.configured == 'true'
        run: ./gradlew publishAllPublicationsToCentralSnapshots --stacktrace
