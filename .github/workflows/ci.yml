# Serp4J CI (implementation-plan.md Paket A, WP4 §6.2, ADR-002, ADR-015).
#
# Kompiliert mit JDK 21 (Java-8-Module mit --release 8), testet auf JDK 21 und JDK 8, prüft Javadoc und
# ArchUnit-Regeln und baut das Central-Portal-Bündel ohne Upload. Bei einem Push auf main werden zusätzlich
# Snapshots publiziert, sobald die Secrets eingerichtet sind (siehe PUBLISHING.md). Der Job browser-tck führt
# die Browser-TCK (Paket F) mit Chromium und beiden Playwright-Treibern aus; der Build-Job bleibt browserfrei.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build und Tests (JDK 21 + JDK 8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 8 zuerst, JDK 21 zuletzt: JAVA_HOME zeigt danach auf 21. Beide JDKs findet Gradle über
      # JAVA_HOME_8_X64 / JAVA_HOME_21_X64 (gradle.properties: org.gradle.java.installations.fromEnv).
      - name: JDK 8 (Test-Laufzeit)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: JDK 21 (Build-Toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build, Tests (JDK 21 und JDK 8), Javadoc, ArchUnit
        run: ./gradlew build --stacktrace

      - name: Central-Portal-Bündel erzeugen (kein Upload)
        run: ./gradlew zipAggregation --stacktrace

      - name: Testberichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  browser-tck:
    name: Browser-TCK (Chromium, Node- und Graal-Treiber)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Serp4J lädt nie selbst Browser (PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1); die CI installiert Chromium
      # ausdrücklich über die Playwright-CLI des Node-Treibers. Beide Treiber nutzen dasselbe Binary.
      - name: Chromium installieren
        run: |
          ./gradlew :serp4j-browser-playwright-driver-node:installPlaywrightBrowsers \
            "-Pserp4j.playwrightInstall=install --with-deps chromium" --stacktrace
          chrome="$(find "$HOME/.cache/ms-playwright" -path '*chromium-*' -type f \( -name chrome -o -name headless_shell \) | sort | head -n 1)"
          test -x "$chrome"
          echo "SERP4J_BROWSER_EXECUTABLE=$chrome" >> "$GITHUB_ENV"

      - name: TCK mit beiden Treibern
        run: >
          ./gradlew :serp4j-browser-playwright-driver-node:browserTest
          :serp4j-browser-playwright-driver-graal:browserTest
          -Pserp4j.browserTests=true --stacktrace

      - name: Testberichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-tck-reports
          path: |
            serp4j-browser-*/build/reports/tests/
            serp4j-browser-*/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  snapshot:
    name: Snapshots nach Maven Central (nur main)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
    steps:
      - name: Secrets prüfen
        id: secrets
        run: |
          # Alle drei müssen nichtleer sein: ein gesetzter, aber leerer Signing-Key würde sonst eine Signatur mit
          # unlesbarem Schlüssel verlangen (serp4j.published.gradle.kts).
          if [ -n "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] && [ -n "$ORG_GRADLE_PROJECT_mavenCentralPassword" ] \
             && [ -n "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Maven-Central- oder Signing-Secrets fehlen, Snapshot-Veröffentlichung übersprungen (siehe PUBLISHING.md)."
          fi

      - name: Checkout
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: JDK 8 (Test-Laufzeit)
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: JDK 21 (Build-Toolchain)
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        if: steps.secrets.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Snapshots publizieren
        if: steps.secrets.outputs.configured == 'true'
        run: ./gradlew publishAllPublicationsToCentralSnapshots --stacktrace
